name: GGA Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gga-review:
    name: GGA Code Review
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so GGA can detect the base branch locally
          # for the PR diff range (shallow checkouts have no main ref).
          fetch-depth: 0
          # Checkout the PR head, NOT the default pull_request merge ref.
          # On a merge ref, `main...HEAD` is empty because the merge commit
          # already contains main, so GGA reports "No matching files changed
          # in PR" and the gate passes without reviewing anything.
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Install GGA
        run: |
          # Keep CI in sync with the locally verified version. v2.8.1 no-ops in
          # --pr-mode --diff-only on a PR head checkout (reports "No matching
          # files changed in PR" even with a non-empty diff).
          git clone --depth 1 --branch v2.10.1 \
            https://github.com/Gentleman-Programming/gentleman-guardian-angel /tmp/gga
          cd /tmp/gga
          ./install.sh
          # install.sh prefers /usr/local/bin (in PATH on ubuntu-latest) but
          # may fall back to $HOME/.local/bin. Add both to PATH defensively.
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify GGA
        run: gga --version
      - name: Install OpenCode CLI
        run: |
          curl -fsSL https://opencode.ai/install | bash
          # The install script places the binary in ~/.opencode/bin. Add it to
          # PATH for this and subsequent steps so `gga run` can shell out to it.
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
      - name: Verify OpenCode CLI
        run: opencode --version
      - name: Configure OpenCode CommandCode provider
        env:
          COMMANDCODE_API_KEY: ${{ secrets.COMMANDCODE_API_KEY }}
        run: |
          # Synthesize a minimal opencode.json defining the custom
          # commandcode provider. The API key is injected via env
          # interpolation and never written to the repo.
          mkdir -p "$HOME/.config/opencode"
          cat << 'EOF' > "$HOME/.config/opencode/opencode.json"
          {
            "$schema": "https://opencode.ai/config.json",
            "provider": {
              "commandcode": {
                "name": "Command Code",
                "npm": "@ai-sdk/openai-compatible",
                "options": {
                  "baseURL": "https://api.commandcode.ai/provider/v1",
                  "apiKey": "{env:COMMANDCODE_API_KEY}"
                },
                "models": {
                  "meta/muse-spark-1.3-contributor": {
                    "id": "meta/muse-spark-1.3-contributor"
                  }
                }
              }
            }
          }
          EOF
      - name: Run GGA
        env:
          COMMANDCODE_API_KEY: ${{ secrets.COMMANDCODE_API_KEY }}
          GGA_PROVIDER: "opencode:commandcode/meta/muse-spark-1.3-contributor"
          PR_BASE_BRANCH: "main"
        run: |
          cat << 'EOF' > .gga
          PROVIDER="opencode:commandcode/meta/muse-spark-1.3-contributor"
          RULES_FILE="AGENTS.md"
          FILE_PATTERNS="*.go,*.mod,*.md,*.yml,*.yaml"
          STRICT_MODE="true"
          TIMEOUT="900"
          PR_BASE_BRANCH="main"
          EOF
          # GGA resolves the base branch as a local ref. After checking out the
          # PR head sha there is no local `main` branch, so the range resolves
          # to nothing and the review no-ops. Recreate the local ref.
          git branch -f main origin/main
          gga run --pr-mode 2>&1 | tee gga-output.txt

      - name: Guard against a vacuous review
        run: |
          # A silent no-op must never look like a passing review.
          if [ -z "$(git diff --name-only "origin/${{ github.event.pull_request.base.ref }}...HEAD")" ]; then
            echo "::error::The PR diff against ${{ github.event.pull_request.base.ref }} is empty; the review gate did not run."
            exit 1
          fi
          if grep -q 'No matching files' gga-output.txt; then
            echo "::error::GGA reported 'No matching files changed in PR' despite a non-empty diff. The review gate did not review anything."
            cat gga-output.txt
            exit 1
          fi
          echo "PR diff contains $(git diff --name-only "origin/${{ github.event.pull_request.base.ref }}...HEAD" | wc -l) changed file(s); GGA reviewed the PR"
